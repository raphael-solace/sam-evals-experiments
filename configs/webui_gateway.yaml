log:
  stdout_log_level: INFO
  log_file_level: DEBUG
  log_file: webui_gateway.log

!include ./shared_config.yaml

apps:
  - name: a2a_webui_app
    app_base_path: .
    app_module: solace_agent_mesh.gateway.http_sse.app

    broker:
      <<: *broker_connection

    app_config:
      namespace: ${NAMESPACE}
      session_secret_key: ${SESSION_SECRET_KEY, please_change_me}

      model: *general_model
      artifact_service: *default_artifact_service
      session_service:
        type: ${PERSISTENCE_TYPE, sql}
        database_url: ${WEB_UI_GATEWAY_DATABASE_URL, sqlite:///webui-gateway.db}
        default_behavior: PERSISTENT

      gateway_id: ${WEBUI_GATEWAY_ID}
      fastapi_host: ${FASTAPI_HOST, 127.0.0.1}
      fastapi_port: ${FASTAPI_PORT, 8000}
      cors_allowed_origins:
        - "http://localhost:3000"
        - "http://127.0.0.1:3000"

      platform_service:
        url: ${PLATFORM_SERVICE_URL, http://localhost:8001}

      frontend_use_authorization: ${FRONTEND_USE_AUTHORIZATION, false}
      enable_embed_resolution: ${ENABLE_EMBED_RESOLUTION, true}
      gateway_artifact_content_limit_bytes: ${GATEWAY_ARTIFACT_LIMIT_BYTES, 10000000}
      sse_max_queue_size: ${SSE_MAX_QUEUE_SIZE, 200}

      system_purpose: >
        The system is an AI chatbot with agentic capabilities.
        It uses the available agents to provide information and assistance.

      response_format: >
        Responses should be clear and concise in Markdown.

      frontend_welcome_message: ${FRONTEND_WELCOME_MESSAGE, "Hello, how can I assist you?"}
      frontend_bot_name: ${FRONTEND_BOT_NAME, "Solace Agent Mesh"}
      frontend_collect_feedback: ${FRONTEND_COLLECT_FEEDBACK, false}
